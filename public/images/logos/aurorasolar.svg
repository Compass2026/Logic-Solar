    <line x1="0" y1="-10" x2="0" y2="-14" stroke="#1a1a1a" stroke-width="1.1" stroke-linecap="round" transform="rotate(150)"/>
    <line x1="0" y1="-10" x2="0" y2="-14" stroke="#1a1a1a" stroke-width="1.1" stroke-linecap="round" transform="rotate(165)"/>
    <line x1="0" y1="-10" x2="0" y2="-14" stroke="#1a1a1a" stroke-width="1.1" stroke-linecap="round" transform="rotate(180)"/>
    <line x1="0" y1="-10" x2="0" y2="-14" stroke="#1a1a1a" stroke-width="1.1" stroke-linecap="round" transform="rotate(195)"/>
