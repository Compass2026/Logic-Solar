  <!-- aurora wordmark — lowercase, medium grey, clean sans -->
  <text
    x="84"
    y="43"
    font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"
    font-size="30"
    font-weight="400"
    fill="#2a2a2a"
