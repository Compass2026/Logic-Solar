    <line x1="0" y1="-10" x2="0" y2="-15" stroke="#1a1a1a" stroke-width="1.2" stroke-linecap="round" transform="rotate(240)"/>
    <line x1="0" y1="-10" x2="0" y2="-16" stroke="#1a1a1a" stroke-width="1.2" stroke-linecap="round" transform="rotate(255)"/>
    <line x1="0" y1="-10" x2="0" y2="-18" stroke="#1a1a1a" stroke-width="1.3" stroke-linecap="round" transform="rotate(270)"/>
    <line x1="0" y1="-10" x2="0" y2="-20" stroke="#1a1a1a" stroke-width="1.4" stroke-linecap="round" transform="rotate(285)"/>
