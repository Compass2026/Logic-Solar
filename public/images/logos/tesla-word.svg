<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 180" width="240" height="180">
  <!-- TESLA - wide tracked, bold black -->
  <text
    x="120"
    y="52"
    font-family="'Arial Black', 'Helvetica Neue', Arial, sans-serif"
    font-size="38"
    font-weight="900"
    fill="#1a1a1a"
    text-anchor="middle"
    letter-spacing="10"
  >TESLA</text>

  <!-- Red divider line -->
  <rect x="20" y="66" width="200" height="4" fill="#E82127" rx="1"/>

  <!-- POWERWALL - bold red -->
  <text
    x="120"
    y="110"
    font-family="'Arial Black', 'Helvetica Neue', Arial, sans-serif"
    font-size="30"
    font-weight="900"
    fill="#E82127"
    text-anchor="middle"
    letter-spacing="2"
  >POWERWALL</text>

  <!-- TESLA HOME BATTERY - small, tracked, dark -->
  <text
    x="120"
    y="138"
    font-family="Arial, Helvetica, sans-serif"
    font-size="11"
    font-weight="600"
    fill="#1a1a1a"
    text-anchor="middle"
    letter-spacing="3"
  >TESLA HOME BATTERY</text>
</svg>